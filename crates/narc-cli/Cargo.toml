[package]
name = "narc-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "narc"
path = "src/main.rs"

[dependencies]
cutile.workspace = true
cuda-core.workspace = true
anyhow.workspace = true
narc-core = { path = "../narc-core" }
narc-gpu = { path = "../narc-gpu" }
narc-bench = { path = "../narc-bench" }
narc-game = { path = "../narc-game" }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true
