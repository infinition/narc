[workspace]
resolver = "2"
members = ["crates/narc-cli", "crates/narc-core", "crates/narc-gpu", "crates/narc-bench"]

[workspace.dependencies]
cutile = "=0.3.1"
cuda-core = "=0.3.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"

[profile.release]
debug = 1
